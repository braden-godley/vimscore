<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- VexFlow embeds its music fonts as data: URLs. The soundfont synth compiles WebAssembly,
         which needs wasm-unsafe-eval (not eval itself) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:"
    />
    <title>vimscore</title>
    <style>
      :root {
        --selected: #1a73e8;
        --insert: #188038;
        --playhead: #d93025;
        --visual: #8430ce;
        --visual-shade: rgba(132, 48, 206, 0.08);
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
      }
      #viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      .score-strip {
        position: relative;
        flex: none;
      }
      .score-strip.animate {
        transition: transform 180ms ease-out;
      }
      .score {
        position: relative;
      }
      .selection-box {
        position: absolute;
        background: var(--visual-shade);
        border-radius: 4px;
      }
      .phantom {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        opacity: 0.75;
      }
      .phantom svg * {
        fill: var(--insert);
        stroke: var(--insert);
      }
      /* The chord or rest the phantom stands in for fades back */
      .vf-stavenote.replacing {
        opacity: 0.25;
      }
      .staff-names {
        position: absolute;
        inset: 0 auto 0 0;
        pointer-events: none;
      }
      .staff-names[hidden] {
        display: none;
      }
      .staff-names div {
        position: absolute;
        left: 0;
        transform: translateY(-50%);
        padding: 0.15rem 0.6rem 0.15rem 0.5rem;
        background: rgba(255, 255, 255, 0.88);
        border-right: 1px solid #ddd;
        border-radius: 0 4px 4px 0;
        font: 13px Georgia, serif;
        color: #333;
        white-space: nowrap;
      }
      .playhead {
        position: absolute;
        top: 0;
        left: 0;
        width: 2px;
        background: var(--playhead);
        opacity: 0.6;
      }
      /* VexFlow sets fill and stroke as attributes, which CSS overrides */
      /* In the insert modes the phantom marks the cursor instead */
      body:not([data-state^="insert"]) .vf-notehead.selected,
      body:not([data-state^="insert"]) .vf-notehead.selected * {
        fill: var(--selected);
        stroke: var(--selected);
      }
      /* The cursor keeps its own color inside the selection */
      .vf-notehead.in-selection:not(.selected),
      .vf-notehead.in-selection:not(.selected) * {
        fill: var(--visual);
        stroke: var(--visual);
      }
      #picker,
      #mixer,
      #parts {
        position: fixed;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        width: min(440px, 90vw);
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        font: 13px ui-monospace, Menlo, monospace;
        overflow: hidden;
      }
      #picker[hidden],
      #mixer[hidden],
      #parts[hidden] {
        display: none;
      }
      .picker-heading {
        padding: 0.5rem 0.8rem 0;
        color: #666;
      }
      .picker-query {
        padding: 0.3rem 0.8rem 0.5rem;
        border-bottom: 1px solid #eee;
        font-size: 15px;
      }
      .picker-query::before {
        content: "> ";
        color: #999;
      }
      .picker-query::after {
        content: "▏";
      }
      #picker ul,
      #parts ul {
        list-style: none;
        margin: 0;
        padding: 0.3rem 0;
      }
      #picker li,
      #parts li {
        display: flex;
        justify-content: space-between;
        padding: 0.2rem 0.8rem;
      }
      #picker li span,
      #parts li span {
        color: #999;
        margin-left: 1rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #picker li.selected,
      #parts li.selected {
        background: var(--selected);
        color: #fff;
      }
      #picker li.selected span,
      #parts li.selected span {
        color: #dde8fb;
      }
      #picker li.empty {
        color: #999;
      }
      #mixer ul {
        list-style: none;
        margin: 0;
        padding: 0.3rem 0;
      }
      #mixer li {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.25rem 0.8rem;
      }
      #mixer li.master {
        border-top: 1px solid #eee;
        margin-top: 0.2rem;
        padding-top: 0.4rem;
      }
      #mixer li.selected {
        background: var(--selected);
        color: #fff;
      }
      .mixer-name {
        flex: 0 0 9rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mixer-bar {
        position: relative;
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: #e6e6e6;
      }
      /* A tick where normal volume is */
      .mixer-bar::after {
        content: "";
        position: absolute;
        left: var(--normal);
        top: -3px;
        bottom: -3px;
        width: 1px;
        background: #999;
      }
      .mixer-level {
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--level);
        border-radius: 3px;
        background: var(--selected);
      }
      #mixer li.selected .mixer-bar {
        background: rgba(255, 255, 255, 0.35);
      }
      #mixer li.selected .mixer-level,
      #mixer li.selected .mixer-bar::after {
        background: #fff;
      }
      .mixer-percent {
        flex: 0 0 3.5rem;
        text-align: right;
      }
      /* M for muted, S for soloed */
      .mixer-flags {
        flex: 0 0 2.5ch;
        font-weight: bold;
      }
      /* A part the mix leaves unheard, by its mute or another's solo */
      #mixer li.silent .mixer-name,
      #mixer li.silent .mixer-bar {
        opacity: 0.4;
      }
      .picker-count {
        padding: 0.3rem 0.8rem 0.5rem;
        border-top: 1px solid #eee;
        color: #999;
      }
      #status {
        display: flex;
        gap: 1.5rem;
        padding: 0.3rem 0.8rem;
        font: 13px ui-monospace, Menlo, monospace;
        border-top: 1px solid #ddd;
        background: #f6f6f6;
      }
      #mode {
        font-weight: bold;
        min-width: 10ch;
      }
      body[data-state^="insert"] #mode {
        color: var(--insert);
      }
      body[data-state="visual"] #mode,
      body[data-state="visualBlock"] #mode {
        color: var(--visual);
      }
      body[data-state="playing"] #mode {
        color: var(--playhead);
      }
      body[data-state="command"] #mode {
        display: none;
      }
      #command-line .command-text::after {
        content: "▏";
      }
      #command-line .command-error {
        margin-left: 1ch;
        color: var(--playhead);
      }
      /* <Tab>'s file names on the command line, the one filled in marked */
      #message span + span {
        margin-left: 2ch;
      }
      #message .current {
        background: var(--visual);
        color: #fff;
      }
      #message.error {
        color: var(--playhead);
      }
      #keys {
        margin-left: auto;
        color: #666;
      }
      /* The manual, over the score down to the status bar; JavaScript sets its bottom */
      #help {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        overflow: hidden;
        padding: 0 1.5rem;
        background: #fff;
        font: 13px/20px ui-monospace, Menlo, monospace;
        white-space: pre;
        color: #222;
      }
      #help[hidden] {
        display: none;
      }
      #help .heading {
        font-weight: bold;
      }
      #help mark {
        background: #fde293;
        color: inherit;
      }
      #help .current mark {
        background: #f9ab00;
      }
      body[data-state="help"] #mode {
        color: var(--selected);
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="picker" hidden></div>
    <div id="mixer" hidden></div>
    <div id="parts" hidden></div>
    <div id="help" hidden></div>
    <div id="status">
      <span id="mode"></span>
      <span id="command-line" hidden></span>
      <span id="message"></span>
      <span id="keys"></span>
      <span id="position"></span>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
