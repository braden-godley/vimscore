<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- VexFlow embeds its music fonts as data: URLs -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:"
    />
    <title>vimscore</title>
    <style>
      :root {
        --selected: #1a73e8;
        --insert: #188038;
        --playhead: #d93025;
        --visual: #8430ce;
        --visual-shade: rgba(132, 48, 206, 0.08);
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
      }
      #viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      .score-strip {
        position: relative;
        flex: none;
      }
      .score-strip.animate {
        transition: transform 180ms ease-out;
      }
      .score {
        position: relative;
      }
      .selection-box {
        position: absolute;
        background: var(--visual-shade);
        border-radius: 4px;
      }
      .phantom {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        opacity: 0.75;
      }
      .phantom svg * {
        fill: var(--insert);
        stroke: var(--insert);
      }
      /* The chord or rest the phantom stands in for fades back */
      .vf-stavenote.replacing {
        opacity: 0.25;
      }
      .playhead {
        position: absolute;
        top: 0;
        left: 0;
        width: 2px;
        background: var(--playhead);
        opacity: 0.6;
      }
      /* VexFlow sets fill and stroke as attributes, which CSS overrides */
      /* In the insert modes the phantom marks the cursor instead */
      body:not([data-state^="insert"]) .vf-notehead.selected,
      body:not([data-state^="insert"]) .vf-notehead.selected * {
        fill: var(--selected);
        stroke: var(--selected);
      }
      /* The cursor keeps its own color inside the selection */
      .vf-notehead.in-selection:not(.selected),
      .vf-notehead.in-selection:not(.selected) * {
        fill: var(--visual);
        stroke: var(--visual);
      }
      #status {
        display: flex;
        gap: 1.5rem;
        padding: 0.3rem 0.8rem;
        font: 13px ui-monospace, Menlo, monospace;
        border-top: 1px solid #ddd;
        background: #f6f6f6;
      }
      #mode {
        font-weight: bold;
        min-width: 10ch;
      }
      body[data-state^="insert"] #mode {
        color: var(--insert);
      }
      body[data-state="visual"] #mode,
      body[data-state="visualBlock"] #mode {
        color: var(--visual);
      }
      body[data-state="playing"] #mode {
        color: var(--playhead);
      }
      body[data-state="prompt"] #mode {
        display: none;
      }
      #prompt .prompt-text::after {
        content: "▏";
      }
      #prompt .prompt-hint {
        color: #999;
      }
      #prompt .prompt-error {
        margin-left: 1ch;
        color: var(--playhead);
      }
      #keys {
        margin-left: auto;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="status">
      <span id="mode"></span>
      <span id="prompt" hidden></span>
      <span id="keys"></span>
      <span id="position"></span>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
